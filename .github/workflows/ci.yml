name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: selftaught
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Root scripts (db:migrate, db:seed, test) are wrapped with
      # `dotenv -e .env --` (see CLAUDE.md Gotcha #8) — a real .env file has
      # to exist for those to find DATABASE_URL etc., even though the values
      # themselves come from this job's own env below.
      - name: Create .env for CI
        run: |
          cat > .env <<EOF
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/selftaught
          NUXT_SESSION_PASSWORD=ci-only-secret-not-used-in-prod-0123456789
          MEDIA_STORAGE_DRIVER=local
          MEDIA_LOCAL_PATH=../../data/media
          NUXT_PUBLIC_SITE_URL=http://localhost:3001
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build admin
        run: pnpm build:admin

      - name: Build frontend
        run: pnpm build:frontend

      - name: Dependency audit (fails on high/critical)
        run: pnpm audit --audit-level=high
